<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Guardian SG-1 · 3D产品展示 | 3D Презентация устройства</title>
<style>
:root {
  --bg: #0a0d14;
  --surface: #111620;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #4f9cff;
  --accent2: #00d4aa;
  --radius: 16px;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

/* Language */
.lang-fab {
  position:fixed; top:20px; right:20px; z-index:99;
  display:flex; gap:4px; background:rgba(17,22,32,0.9); border-radius:30px;
  padding:4px; border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(12px);
}
.lang-fab button {
  padding:8px 18px; border-radius:26px; border:none; background:transparent;
  color:var(--text2); cursor:pointer; font-size:12px; font-weight:700; transition:all .25s;
}
.lang-fab button.active { background:var(--accent); color:#fff; }
body.ru .zh { display:none; }
body.zh .ru { display:none; }

/* Info overlay */
.info-overlay {
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:linear-gradient(transparent, rgba(10,13,20,0.95) 40%);
  padding:60px 24px 32px; pointer-events:none;
}
.info-overlay .title-row { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.info-overlay h1 { font-size:clamp(24px,4vw,40px); font-weight:900; }
.info-overlay h1 .hl { background:linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.info-overlay .tag { font-size:13px; color:var(--text2); margin-top:8px; max-width:500px; }

/* Control hints */
.hints {
  position:fixed; bottom:36px; right:24px; z-index:60;
  display:flex; gap:14px; flex-wrap:wrap;
}
.hint-item {
  display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text2);
  background:rgba(17,22,32,0.8); padding:8px 14px; border-radius:20px;
  border:1px solid rgba(255,255,255,0.06); backdrop-filter:blur(8px);
}
.hint-item .key {
  background:rgba(255,255,255,0.08); padding:2px 8px; border-radius:4px;
  font-family:monospace; font-size:10px; color:#ccc;
}

/* Hotspot labels */
.hotspot-label {
  position:fixed; pointer-events:none; z-index:55; font-size:11px;
  background:rgba(79,156,255,0.15); border:1px solid rgba(79,156,255,0.4);
  color:#fff; padding:4px 10px; border-radius:12px; white-space:nowrap;
  transform:translate(-50%, -50%); opacity:0; transition:opacity .3s;
  backdrop-filter:blur(4px);
}
.hotspot-label.show { opacity:1; }

/* View buttons */
.view-btns {
  position:fixed; left:24px; bottom:50%; transform:translateY(50%); z-index:60;
  display:flex; flex-direction:column; gap:8px;
}
.view-btn {
  width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,0.1);
  background:rgba(17,22,32,0.8); color:var(--text2); cursor:pointer;
  font-size:18px; transition:all .25s; display:flex; align-items:center;
  justify-content:center; backdrop-filter:blur(8px);
}
.view-btn:hover, .view-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Detail panels */
.detail-panel {
  position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:100;
  background:rgba(17,22,32,0.95); border:1px solid rgba(79,156,255,0.3);
  border-radius:var(--radius); padding:28px; width:90%; max-width:480px;
  display:none; backdrop-filter:blur(20px); box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.detail-panel.open { display:block; animation:fadeIn .3s ease; }
.detail-panel h3 { font-size:18px; margin-bottom:8px; }
.detail-panel p { font-size:13px; color:var(--text2); line-height:1.6; margin-bottom:16px; }
.detail-panel .close-btn {
  position:absolute; top:12px; right:16px; background:none; border:none;
  color:var(--text2); font-size:22px; cursor:pointer;
}
.detail-panel .spec-row { display:flex; gap:20px; flex-wrap:wrap; }
.detail-panel .spec-item { text-align:center; }
.detail-panel .spec-item .val { font-size:22px; font-weight:900; color:var(--accent); }
.detail-panel .spec-item .lbl { font-size:10px; color:var(--text2); }

@keyframes fadeIn { from{opacity:0;transform:translate(-50%,-48%)} to{opacity:1;transform:translate(-50%,-50%)} }

/* Mode tabs */
.mode-tabs {
  position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:60;
  display:flex; gap:4px; background:rgba(17,22,32,0.9); border-radius:12px;
  padding:4px; border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(12px);
}
.mode-tab {
  padding:8px 18px; border-radius:10px; border:none; background:transparent;
  color:var(--text2); cursor:pointer; font-size:12px; font-weight:600;
  transition:all .25s; white-space:nowrap;
}
.mode-tab.active { background:rgba(79,156,255,0.2); color:var(--accent); }

/* Responsive */
@media (max-width:768px) {
  .view-btns { left:8px; gap:4px; }
  .view-btn { width:36px; height:36px; font-size:14px; }
  .hints { bottom:20px; right:8px; gap:6px; }
  .hint-item { font-size:10px; padding:6px 10px; }
  .mode-tabs { top:12px; }
  .mode-tab { padding:6px 12px; font-size:10px; }
}

canvas { display:block; }
</style>
</head>
<body class="zh">

<!-- Language -->
<div class="lang-fab">
  <button id="btnZh" class="active" onclick="setLang('zh')">中文</button>
  <button id="btnRu" onclick="setLang('ru')">РУС</button>
</div>

<!-- Mode tabs -->
<div class="mode-tabs">
  <button class="mode-tab active" data-mode="full" onclick="switchMode('full')">
    <span class="zh">完整设备</span><span class="ru">Устройство</span>

<!-- Detail panel -->
<div class="detail-panel" id="detailPanel">

  <h3 id="detailTitle"></h3>
  <p id="detailDesc"></p>
  <div class="spec-row" id="detailSpecs"></div>
</div>

<!-- Info overlay -->
<div class="info-overlay">
  <div class="title-row">
    <h1>
      <span class="zh">银发守护者 <span class="hl">SG-1</span></span>
      <span class="ru">Silver Guardian <span class="hl">SG-1</span></span>
    </h1>
  </div>
  <p class="tag">
    <span class="zh">60GHz毫米波雷达 · AI智能监测 · 非接触式全天候守护 · 拖动鼠标旋转查看</span>
    <span class="ru">Радар 60ГГц · AI мониторинг · Бесконтактная защита 24/7 · Вращайте мышью</span>
  </p>
</div>

<!-- Hints -->
<div class="hints">
  <div class="hint-item"><span class="key">🖱</span> <span class="zh">拖拽旋转</span><span class="ru">Вращение</span></div>
  <div class="hint-item"><span class="key">🖱🖱</span> <span class="zh">滚轮缩放</span><span class="ru">Масштаб</span></div>
  <div class="hint-item"><span class="key">👆</span> <span class="zh">双击零件</span><span class="ru">Детали</span></div>
</div>

<!-- Hotspot labels -->
<div class="hotspot-label" id="hotspotLabel"></div>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== SCENE SETUP =====
const scene = new THREE.Scene();

// Gradient background
const bgColor = new THREE.Color(0x0a0d14);
scene.background = bgColor;
scene.fog = new THREE.Fog(0x0a0d14, 2, 15);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.15, 30);
camera.position.set(0.8, 0.5, 2.6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.6;
controls.maxDistance = 5;
controls.maxPolarAngle = Math.PI * 0.75;
controls.target.set(0, 0, 0);
controls.update();

// ===== LIGHTING =====
// Ambient
const ambient = new THREE.AmbientLight(0x334466, 1.8);
scene.add(ambient);

// Key light
const keyLight = new THREE.DirectionalLight(0xffeedd, 5.5);
keyLight.position.set(3, 3, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.near = 0.3;
keyLight.shadow.camera.far = 15;
keyLight.shadow.camera.left = -3;
keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0001;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

// Rim light
const rimLight = new THREE.DirectionalLight(0x4488cc, 3.5);
rimLight.position.set(-2, 0.5, -1.5);
scene.add(rimLight);

// Fill light
const fillLight = new THREE.DirectionalLight(0x8899bb, 2.2);
fillLight.position.set(0, -0.5, 2);
scene.add(fillLight);

// Accent point light (for LED glow effect)
const accentLight = new THREE.PointLight(0x4f9cff, 8, 0.8);
accentLight.position.set(0, 0, 0.15);
scene.add(accentLight);

// Top accent
const topLight = new THREE.PointLight(0x88bbff, 3, 1.5);
topLight.position.set(0, 0.6, 0);
scene.add(topLight);

// ===== MATERIALS =====
// Body material - matte white plastic
const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0xe8ecf1,
  roughness: 0.35,
  metalness: 0.05,
});

// Body side material - slightly darker
const bodySideMaterial = new THREE.MeshStandardMaterial({
  color: 0xd5dbe3,
  roughness: 0.3,
  metalness: 0.08,
});

// Lens material - dark glass
const lensMaterial = new THREE.MeshStandardMaterial({
  color: 0x0a1520,
  roughness: 0.2,
  metalness: 0.15,
});

// Lens inner material
const lensInnerMaterial = new THREE.MeshStandardMaterial({
  color: 0x060d15,
  roughness: 0.15,
  metalness: 0.3,
});

// LED ring material (emissive)
const ledRingMaterial = new THREE.MeshStandardMaterial({
  color: 0x4f9cff,
  roughness: 0.2,
  metalness: 0.4,
  emissive: 0x2255aa,
  emissiveIntensity: 0.7,
});

// Metal accent material
const metalMaterial = new THREE.MeshStandardMaterial({
  color: 0xbcc4ce,
  roughness: 0.2,
  metalness: 0.85,
});

// Speaker grille material
const grilleMaterial = new THREE.MeshStandardMaterial({
  color: 0x8899aa,
  roughness: 0.5,
  metalness: 0.2,
});

// PCB material
const pcbMaterial = new THREE.MeshStandardMaterial({
  color: 0x0d2d0d,
  roughness: 0.6,
  metalness: 0.1,
});

// Chip material
const chipMaterial = new THREE.MeshStandardMaterial({
  color: 0x111a22,
  roughness: 0.25,
  metalness: 0.5,
});

// Antenna material
const antennaMaterial = new THREE.MeshStandardMaterial({
  color: 0xc8a050,
  roughness: 0.15,
  metalness: 0.9,
});

// ===== GROUPS =====
const mainGroup = new THREE.Group();
const explodedGroup = new THREE.Group();
const xrayGroup = new THREE.Group();
scene.add(mainGroup);
scene.add(explodedGroup);
scene.add(xrayGroup);

explodedGroup.visible = false;
xrayGroup.visible = false;

// ==================== BUILD DEVICE MODEL ====================

function createDeviceBody(parent, yOffset = 0) {
  const group = new THREE.Group();

  // Main body - flat cylinder (disk)
  const bodyGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.14, 64);
  const body = new THREE.Mesh(bodyGeo, bodySideMaterial.clone());
  body.position.y = yOffset;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Body edge ring (subtle bevel)
  const edgeGeo = new THREE.TorusGeometry(0.6, 0.008, 16, 64);
  const edge = new THREE.Mesh(edgeGeo, metalMaterial.clone());
  edge.rotation.x = Math.PI / 2;
  edge.position.y = yOffset + 0.07;
  group.add(edge);

  const edgeBottom = new THREE.Mesh(edgeGeo, metalMaterial.clone());
  edgeBottom.rotation.x = Math.PI / 2;
  edgeBottom.position.y = yOffset - 0.07;
  group.add(edgeBottom);

  // Front face (top of cylinder)
  const faceGeo = new THREE.CylinderGeometry(0.595, 0.595, 0.003, 64);
  const face = new THREE.Mesh(faceGeo, bodyMaterial.clone());
  face.position.y = yOffset + 0.07;
  face.receiveShadow = true;
  group.add(face);

  // Slightly recessed inner face
  const innerFaceGeo = new THREE.CylinderGeometry(0.54, 0.54, 0.002, 64);
  const innerFace = new THREE.Mesh(innerFaceGeo, new THREE.MeshStandardMaterial({
    color: 0xdce2e8,
    roughness: 0.4,
    metalness: 0.05,
  }));
  innerFace.position.y = yOffset + 0.069;
  group.add(innerFace);

  // LED ring channel
  const ledChannelGeo = new THREE.TorusGeometry(0.525, 0.012, 16, 80);
  const ledChannel = new THREE.Mesh(ledChannelGeo, new THREE.MeshStandardMaterial({
    color: 0x334466,
    roughness: 0.1,
    metalness: 0.6,
    emissive: 0x112244,
    emissiveIntensity: 0.4,
  }));
  ledChannel.rotation.x = Math.PI / 2;
  ledChannel.position.y = yOffset + 0.072;
  ledChannel.name = 'ledRing';
  group.add(ledChannel);

  // Glowing LED ring
  const ledGlowGeo = new THREE.TorusGeometry(0.525, 0.006, 8, 80);
  const ledGlow = new THREE.Mesh(ledGlowGeo, ledRingMaterial.clone());
  ledGlow.rotation.x = Math.PI / 2;
  ledGlow.position.y = yOffset + 0.073;
  ledGlow.name = 'ledGlow';
  group.add(ledGlow);

  // Lens recess
  const lensRecessGeo = new THREE.CylinderGeometry(0.36, 0.37, 0.015, 64);
  const lensRecess = new THREE.Mesh(lensRecessGeo, new THREE.MeshStandardMaterial({
    color: 0x1a2a38,
    roughness: 0.3,
    metalness: 0.4,
  }));
  lensRecess.position.y = yOffset + 0.065;
  group.add(lensRecess);

  // Main lens
  const lensGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.006, 64);
  const lens = new THREE.Mesh(lensGeo, lensMaterial.clone());
  lens.position.y = yOffset + 0.067;
  lens.receiveShadow = true;
  lens.name = 'lens';
  group.add(lens);

  // Lens inner ring
  const lensRingGeo = new THREE.TorusGeometry(0.28, 0.004, 8, 64);
  const lensRing = new THREE.Mesh(lensRingGeo, new THREE.MeshStandardMaterial({
    color: 0x2a4058,
    roughness: 0.1,
    metalness: 0.7,
  }));
  lensRing.rotation.x = Math.PI / 2;
  lensRing.position.y = yOffset + 0.07;
  group.add(lensRing);

  // Inner dark lens
  const innerLensGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.004, 64);
  const innerLens = new THREE.Mesh(innerLensGeo, lensInnerMaterial.clone());
  innerLens.position.y = yOffset + 0.07;
  innerLens.name = 'innerLens';
  group.add(innerLens);

  // Center radar dot
  const dotGeo = new THREE.SphereGeometry(0.02, 16, 16);
  const dot = new THREE.Mesh(dotGeo, new THREE.MeshStandardMaterial({
    color: 0x00ffcc,
    roughness: 0.1,
    metalness: 0.2,
    emissive: 0x00d4aa,
    emissiveIntensity: 1.5,
  }));
  dot.position.y = yOffset + 0.073;
  dot.name = 'radarDot';
  group.add(dot);

  // Radar wave rings (decorative)
  for (let i = 0; i < 3; i++) {
    const waveGeo = new THREE.TorusGeometry(0.06 + i * 0.06, 0.0015, 8, 48);
    const wave = new THREE.Mesh(waveGeo, new THREE.MeshBasicMaterial({
      color: 0x00d4aa,
      transparent: true,
      opacity: 0.35 - i * 0.1,
    }));
    wave.rotation.x = Math.PI / 2;
    wave.position.y = yOffset + 0.0731;
    wave.name = `wave${i}`;
    group.add(wave);
  }

  // Speaker grille - array of small holes
  const grilleGroup = new THREE.Group();
  const holeGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.004, 8);
  const rows = 2;
  const cols = 11;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const hole = new THREE.Mesh(holeGeo, new THREE.MeshStandardMaterial({
        color: 0x556070,
        roughness: 0.8,
        metalness: 0.05,
      }));
      const angle = ((c / (cols - 1)) - 0.5) * 0.55;
      const radius = 0.52;
      hole.position.x = Math.sin(angle) * radius;
      hole.position.z = Math.cos(angle) * radius;
      hole.position.y = yOffset + 0.065;
      hole.rotation.y = -angle;
      grilleGroup.add(hole);
    }
  }
  grilleGroup.position.z = -0.22;
  grilleGroup.name = 'grille';
  group.add(grilleGroup);

  // Sensor window (tiny IR sensor)
  const sensorGeo = new THREE.BoxGeometry(0.06, 0.02, 0.01);
  const sensor = new THREE.Mesh(sensorGeo, new THREE.MeshStandardMaterial({
    color: 0x080c12,
    roughness: 0.1,
    metalness: 0.5,
  }));
  sensor.position.set(0.45, yOffset + 0.07, 0);
  sensor.name = 'sensor';
  group.add(sensor);

  // USB-C port on side
  const usbGeo = new THREE.BoxGeometry(0.05, 0.02, 0.02);
  const usb = new THREE.Mesh(usbGeo, new THREE.MeshStandardMaterial({
    color: 0x1a1e24,
    roughness: 0.3,
    metalness: 0.6,
  }));
  usb.position.set(0, yOffset, 0.597);
  usb.name = 'usb';
  group.add(usb);

  // Bottom surface
  const bottomGeo = new THREE.CylinderGeometry(0.595, 0.595, 0.003, 64);
  const bottom = new THREE.Mesh(bottomGeo, new THREE.MeshStandardMaterial({
    color: 0xc8d0d8,
    roughness: 0.5,
    metalness: 0.05,
  }));
  bottom.position.y = yOffset - 0.07;
  group.add(bottom);

  // Mount plate on back
  const mountGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.01, 32);
  const mount = new THREE.Mesh(mountGeo, new THREE.MeshStandardMaterial({
    color: 0xbcc4ce,
    roughness: 0.3,
    metalness: 0.4,
  }));
  mount.position.y = yOffset - 0.075;
  group.add(mount);

  // Mount holes
  for (let a = 0; a < 4; a++) {
    const holeGeo2 = new THREE.CylinderGeometry(0.025, 0.025, 0.015, 16);
    const hole2 = new THREE.Mesh(holeGeo2, new THREE.MeshStandardMaterial({
      color: 0x667080,
      roughness: 0.6,
      metalness: 0.3,
    }));
    const hAngle = (a / 4) * Math.PI * 2 + Math.PI / 4;
    hole2.position.x = Math.cos(hAngle) * 0.14;
    hole2.position.z = Math.sin(hAngle) * 0.14;
    hole2.position.y = yOffset - 0.078;
    mount.add(hole2);
  }

  // Model label
  const labelGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.001, 32);
  const label = new THREE.Mesh(labelGeo, new THREE.MeshStandardMaterial({
    color: 0xccd0d6,
    roughness: 0.5,
    metalness: 0.1,
  }));
  label.position.y = yOffset - 0.069;
  group.add(label);

  return group;
}

// ===== INTERNAL COMPONENTS (for exploded & xray views) =====
function createRadarModule(yOffset = 0) {
  const group = new THREE.Group();
  // PCB board
  const pcbGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.01, 48);
  const pcb = new THREE.Mesh(pcbGeo, pcbMaterial);
  pcb.position.y = yOffset;
  group.add(pcb);

  // Antenna array (golden rectangles on PCB)
  for (let i = 0; i < 5; i++) {
    const antGeo = new THREE.BoxGeometry(0.03, 0.003, 0.06);
    const ant = new THREE.Mesh(antGeo, antennaMaterial.clone());
    ant.position.set((i - 2) * 0.08, yOffset + 0.006, 0.05);
    group.add(ant);
  }

  // Radar chip
  const chipGeo = new THREE.BoxGeometry(0.08, 0.012, 0.08);
  const chip = new THREE.Mesh(chipGeo, chipMaterial);
  chip.position.set(0, yOffset + 0.007, -0.05);
  group.add(chip);

  group.name = 'radarModule';
  return group;
}

function createAIModule(yOffset = 0) {
  const group = new THREE.Group();
  const pcbGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.01, 48);
  const pcb = new THREE.Mesh(pcbGeo, new THREE.MeshStandardMaterial({
    color: 0x0d1d0d,
    roughness: 0.5,
    metalness: 0.15,
  }));
  pcb.position.y = yOffset;

  positions[i * 3 + 1] = Math.random() * 3 - 0.5;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 6;
}

// ===== RAYCASTER FOR CLICKING =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function onDoubleClick(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const activeGroup = mainGroup.visible ? mainGroup :
                       explodedGroup.visible ? explodedGroup : xrayGroup;
  const intersects = raycaster.intersectObjects(activeGroup.children, true);

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    let name = obj.name;
    // Walk up to find named parent
    let current = obj;
    while (current && !name) {
      current = current.parent;
      if (current && current.name) name = current.name;
    }
    if (name && name !== '') {
      showDetail(name);
    }
  }
}

window.addEventListener('dblclick', onDoubleClick);

// ===== ANIMATION LOOP =====
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();
  controls.update();

  // Pulse LED glow
  const ledIntensity = 0.5 + Math.sin(time * 2.5) * 0.35;
  const activeGroup = mainGroup.visible ? mainGroup :
                       explodedGroup.visible ? explodedGroup : xrayGroup;

  activeGroup.traverse(child => {
    if (child.name === 'ledGlow' && child.material.emissiveIntensity !== undefined) {
      child.material.emissiveIntensity = ledIntensity;
      child.material.emissive = new THREE.Color().setHSL(0.58, 0.9, 0.15 + ledIntensity * 0.2);
    }
    // Pulse center dot
    if (child.name === 'radarDot') {
      const s = 1 + Math.sin(time * 3.5) * 0.4;
      child.scale.setScalar(s);
      child.material.emissiveIntensity = 1 + Math.sin(time * 3.5) * 0.6;
    }
    // Animate radar waves
    if (child.name && child.name.startsWith('wave')) {
      const idx = parseInt(child.name.replace('wave', ''));
      const s = 1 + Math.sin(time * 2 + idx * 0.8) * 0.5;
      child.scale.setScalar(s);
      child.material.opacity = 0.35 - idx * 0.1 - Math.abs(Math.sin(time * 2 + idx)) * 0.1;
    }
  });

  // Gentle particle drift
  particles.rotation.y += 0.0006;
  particles.rotation.x += 0.0003;

  // Accent light pulse
  accentLight.intensity = 7 + Math.sin(time * 2.5) * 2;

  renderer.render(scene, camera);
}

animate();

window.switchMode = function(mode) {
  mainGroup.visible = mode === 'full';
  explodedGroup.visible = mode === 'exploded';
  xrayGroup.visible = mode === 'xray';

  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });

  if (mode === 'exploded') {
    camera.position.set(2, 0.6, 2.2);
    controls.target.set(0, 0.08, 0);
  } else if (mode === 'xray') {
    camera.position.set(0.8, 0.8, 2.2);
    controls.target.set(0, 0, 0);
  } else {
    camera.position.set(0.8, 0.5, 2.6);
    controls.target.set(0, 0, 0);
  }
  controls.update();
};

window.setView = function(view) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const dist = 2.4;
  switch(view) {
    case 'front':
      camera.position.set(0, 0, dist);
      controls.target.set(0, 0, 0);
      break;
    case 'side':
      camera.position.set(dist, 0, 0);
      controls.target.set(0, 0, 0);
      break;
    case 'top':
      camera.position.set(0, dist, 0.01);
      controls.target.set(0, 0, 0);
      break;
    case 'persp':
      camera.position.set(0.8, 0.5, 2.6);
      controls.target.set(0, 0, 0);
      break;
  }
  controls.update();
};
